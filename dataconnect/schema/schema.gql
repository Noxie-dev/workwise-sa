type User @table {
  email: String!
  passwordHash: String!
  accountType: String!
  createdAt: Timestamp!
  displayName: String
  photoUrl: String
}

type JobSeekerProfile @table {
  user: User!
  firstName: String!
  lastName: String!
  phoneNumber: String
  resumeUrl: String
  headline: String
  skills: [String]
  experience: String
  education: String
  desiredJobType: [String]
}

type EmployerProfile @table {
  user: User!
  companyName: String!
  contactPerson: String!
  industry: String!
  companyDescription: String
  website: String
  companyLogoUrl: String
}

type JobPosting @table {
  employerProfile: EmployerProfile!
  title: String!
  description: String!
  location: String!
  jobType: String!
  salaryRange: String!
  createdAt: Timestamp!
  requirements: String
  benefits: String
  applicationDeadline: Date
}

type Application @table {
  jobSeekerProfile: JobSeekerProfile!
  jobPosting: JobPosting!
  applicationDate: Timestamp!
  status: String!
  coverLetter: String
  resumeUrl: String
}
