<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A4365" />
    <title>Offline | WorkWise SA</title>
    <style>
      :root {
        color: #102a47;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: #f8fafc;
        background-image:
          linear-gradient(45deg, rgba(15, 23, 42, 0.055) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(15, 23, 42, 0.055) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(15, 23, 42, 0.055) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(15, 23, 42, 0.055) 75%);
        background-position:
          0 0,
          0 12px,
          12px -12px,
          -12px 0;
        background-size: 24px 24px;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 28px;
        text-align: center;
      }

      img {
        height: 88px;
        width: auto;
        object-fit: contain;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.45rem;
      }

      p {
        margin: 0;
        color: #53657d;
        line-height: 1.6;
      }

      a,
      button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        margin-top: 20px;
        border: 0;
        border-radius: 8px;
        background: #5aaee9;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/header-logo.png" alt="WorkWise SA" />
      <h1>You are offline</h1>
      <p>
        WorkWise SA has saved the app shell for offline use. Reconnect to refresh jobs, account
        data, applications, and AI tools.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <a href="/">Open saved home</a>
    </main>
  </body>
</html>
