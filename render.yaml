# Render blueprint for the canonical Express runtime.
# This config provisions the web service plus a managed PostgreSQL dependency.

databases:
  - name: workwise-sa-db
    databaseName: workwise_sa
    user: workwise_sa
    plan: starter

services:
  - type: web
    name: workwise-sa-web
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    disks:
      - name: workwise-sa-uploads
        mountPath: /opt/render/project/src/uploads
        sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workwise-sa-db
          property: connectionString
      - key: VITE_API_URL
        value: /api
      - key: VITE_USE_FIREBASE_EMULATORS
        value: "false"
      - key: VITE_USE_MOCK_PUBLIC_DATA
        value: "false"
